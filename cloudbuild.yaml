steps:
  # Build de la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/odoo:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/odoo:$BRANCH_NAME'
      - '-t'
      - 'gcr.io/$PROJECT_ID/odoo:latest'
      - '.'

  # Push de la imagen
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/odoo:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/odoo:$BRANCH_NAME'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/odoo:latest'

  # Deploy a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'odoo-${_ENVIRONMENT}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/odoo:$COMMIT_SHA'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

substitutions:
  _ENVIRONMENT: dev  # Cambiar según el branch: dev, staging, prod

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/odoo:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/odoo:$BRANCH_NAME'
  - 'gcr.io/$PROJECT_ID/odoo:latest'

timeout: '1800s'
